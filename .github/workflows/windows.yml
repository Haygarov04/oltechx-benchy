# Инсталаторът за Windows се сглобява тук, защото от Mac не може. Пуска се с таг v* (например v0.1.0)
# или ръчно. Файлът отива в Releases и се сваля безплатно от
# https://github.com/Haygarov04/oltechx-proverka/releases/latest/download/OLTechX-Proverka-Setup.exe
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
