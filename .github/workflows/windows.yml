# Инсталаторът за Windows се сглобява тук, защото от Mac не може. Пуска се с таг v* (например v0.1.1).
# Файлът отива в Releases и се сваля безплатно от
# https://github.com/Haygarov04/oltechx-benchy/releases/latest/download/OLTechX-Proverka-Setup.exe
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      # Едно издание с всички файлове. electron-builder сам понякога прави две за един таг.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/OLTechX-Proverka-Setup.exe
            release/OLTechX-Proverka-Setup.exe.blockmap
            release/latest.yml
