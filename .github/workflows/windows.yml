# Builds the Windows installer, which cannot be built on macOS. Runs on a v* tag (for example v0.2.1)
# or manually. The file goes to Releases and is downloaded for free from
# https://github.com/Haygarov04/oltechx-benchy/releases/latest/download/OLTechX-Check-Setup.exe
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      # One release with all files. electron-builder on its own sometimes creates two for one tag.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/OLTechX-Check-Setup.exe
            release/OLTechX-Check-Setup.exe.blockmap
            release/latest.yml
