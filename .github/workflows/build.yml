# Builds the installers, which cannot all be built on one machine. Runs on a v* tag (for example v0.3.1)
# or manually. Files go to Releases and are downloaded for free from
# https://github.com/Haygarov04/oltechx-benchy/releases/latest/download/<file>
#   Windows: OLTechX-Check-Setup.exe
#   macOS:   OLTechX-Check-mac-arm64.dmg / -x64.dmg (and .zip for the curl installer on oltechx.com)
#   Android: OLTechX-Check.apk
name: Build

on:
  push:
    tags: ["v*"]
    # A push to android-preview builds only the Android app, to check it before a release.
    branches: ["android-preview"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/OLTechX-Check-Setup.exe
            release/OLTechX-Check-Setup.exe.blockmap
            release/latest.yml

  mac:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/OLTechX-Check-mac-arm64.dmg
            release/OLTechX-Check-mac-x64.dmg
            release/OLTechX-Check-mac-arm64.zip
            release/OLTechX-Check-mac-x64.zip
            release/latest-mac.yml

  # The Android app: the same interface in Capacitor. Signed with the release key from the repository secrets
  # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
  # Without them it is signed with a temporary debug key: it installs, but later versions cannot update it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:renderer
      - run: npx cap sync android
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Compiler errors are also shown as annotations, so they are visible without opening the log.
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            grep -E "error:|e: |FAILURE|What went wrong" -A3 "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - run: cp android/app/build/outputs/apk/release/app-release.apk OLTechX-Check.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OLTechX-Check.apk

  # The release appears only when every file is ready, so "latest" never points to a release
  # that is missing a file. electron-builder on its own sometimes creates two releases for one tag.
  release:
    needs: [windows, mac, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
