# Builds the installers, which cannot all be built on one machine. Runs on a v* tag (for example v0.3.1)
# or manually. Files go to Releases and are downloaded for free from
# https://github.com/Haygarov04/oltechx-benchy/releases/latest/download/<file>
#   Windows: OLTechX-Check-Setup.exe
#   macOS:   OLTechX-Check-mac-arm64.dmg / -x64.dmg (and .zip for the curl installer on oltechx.com)
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      # One release with all files. electron-builder on its own sometimes creates two for one tag.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/OLTechX-Check-Setup.exe
            release/OLTechX-Check-Setup.exe.blockmap
            release/latest.yml

  # Runs after Windows so both jobs add files to the same release instead of racing to create it.
  mac:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/OLTechX-Check-mac-arm64.dmg
            release/OLTechX-Check-mac-x64.dmg
            release/OLTechX-Check-mac-arm64.zip
            release/OLTechX-Check-mac-x64.zip
            release/latest-mac.yml
